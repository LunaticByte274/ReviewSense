events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Rate Limiting (20 requests per second per IP)
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;

    # WebSocket Upgrade mapping for Streamlit
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    server {
        listen 80;
        server_name _;

        # Maximum upload size matching AppConfig (25MB)
        client_max_body_size 25M;

        # Security Headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        location / {
            limit_req zone=api_limit burst=30 nodelay;

            proxy_pass http://reviewsense_app:8501;
            proxy_http_version 1.1;

            # Streamlit WebSocket and SSE support
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Timeouts
            proxy_read_timeout 86400;
            proxy_send_timeout 86400;
        }

        # Streamlit health check passthrough
        location /_stcore/health {
            proxy_pass http://reviewsense_app:8501/_stcore/health;
            access_log off;
        }
    }
}
